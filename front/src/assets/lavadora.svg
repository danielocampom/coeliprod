<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="title desc">
  <title id="title">Lavadora estilizada</title>
  <desc id="desc">Ilustración vectorial de una lavadora moderna con puerta circular y panel superior.</desc>

  <style>
    :root{
      --body:#e9eef6;           /* color del cuerpo */
      --body-shadow:#cfd8e6;    /* sombra lateral */
      --accent:#4f7cff;         /* acentos/botones */
      --accent-2:#9ab3ff;       /* acentos claros */
      --glass:#a8d3ff;          /* tono del vidrio */
      --glass-deep:#5fb2ff;     /* tono profundo del vidrio */
      --inner:#0a2240;          /* interior oscuro del bombo */
      --detail:#6b7a90;         /* líneas/detalles */
      --warning:#ffcc4d;        /* luz/indicador */
    }
  </style>

  <!-- Sombra base -->
  <ellipse cx="160" cy="338" rx="110" ry="12" fill="#000" opacity="0.12"/>

  <!-- Cuerpo principal -->
  <rect x="40" y="30" width="240" height="300" rx="24" fill="var(--body)"/>
  <!-- Panel lateral sombreado -->
  <path d="M280,54v252c-24,12-49,18-75,18H88c-11,0-21-1-31-4V54c10,3 20,4 31,4h117c26,0 51-6 75-18Z"
        fill="var(--body-shadow)" opacity="0.22"/>

  <!-- Bisel frontal -->
  <rect x="52" y="42" width="216" height="276" rx="18" fill="#fff" opacity="0.55"/>

  <!-- Panel superior -->
  <rect x="60" y="48" width="200" height="66" rx="14" fill="#fff" />
  <rect x="60" y="48" width="200" height="66" rx="14" fill="url(#panelGrad)" opacity="0.55"/>
  <line x1="60" y1="82" x2="260" y2="82" stroke="var(--detail)" stroke-width="1.2" opacity="0.35"/>

  <!-- Pantallita -->
  <rect x="76" y="60" width="96" height="18" rx="6" fill="#e6eefc"/>
  <rect x="76" y="60" width="96" height="18" rx="6" fill="var(--accent)" opacity="0.12"/>

  <!-- Botones -->
  <circle cx="194" cy="69" r="8" fill="var(--accent)"/>
  <circle cx="214" cy="69" r="8" fill="var(--accent-2)"/>
  <circle cx="234" cy="69" r="8" fill="var(--warning)"/>

  <!-- Selector grande -->
  <circle cx="212" cy="99" r="16" fill="#fff" stroke="var(--detail)" stroke-width="1.5"/>
  <circle cx="212" cy="99" r="6" fill="var(--accent)"/>

  <!-- Marco de la puerta -->
  <circle cx="160" cy="205" r="88" fill="#fff" stroke="var(--detail)" stroke-width="1.5"/>
  <circle cx="160" cy="205" r="78" fill="#f7f9ff"/>

  <!-- Aro metálico -->
  <circle cx="160" cy="205" r="72" fill="url(#rimGrad)"/>

  <!-- Vidrio / agua -->
  <defs>
    <radialGradient id="glassGrad" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="var(--glass)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--glass-deep)" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe6f2"/>
      <stop offset="50%" stop-color="#bcc8dc"/>
      <stop offset="100%" stop-color="#e7edf7"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e8eef9" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="shine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Interior oscuro -->
  <circle cx="160" cy="205" r="60" fill="var(--inner)"/>

  <!-- Olas/agua -->
  <path d="M104,210c15-10 28-8 40,0s28,10 40,0 28-10 40,0v20H104Z"
        fill="var(--glass)" opacity="0.55"/>
  <path d="M104,228c15-8 28-6 40,0s28,8 40,0 28-8 40,0v14H104Z"
        fill="var(--glass-deep)" opacity="0.55"/>

  <!-- Vidrio con brillo -->
  <circle cx="160" cy="205" r="54" fill="url(#glassGrad)"/>
  <path d="M122,170c22-12 46-10 62,2" fill="none" stroke="#fff" stroke-width="8" opacity="0.55" filter="url(#shine)"/>
  <path d="M128,246c16,6 28,6 44,0" fill="none" stroke="#fff" stroke-width="4" opacity="0.35"/>

  <!-- Bisagra y tirador -->
  <rect x="108" y="196" width="8" height="18" rx="2" fill="var(--detail)" opacity="0.6"/>
  <rect x="211" y="190" width="14" height="30" rx="4" fill="var(--accent)" opacity="0.8"/>

  <!-- Patitas -->
  <rect x="72" y="320" width="34" height="8" rx="3" fill="var(--detail)" opacity="0.55"/>
  <rect x="214" y="320" width="34" height="8" rx="3" fill="var(--detail)" opacity="0.55"/>

  <!-- Estrellitas de limpio -->
  <g opacity="0.8">
    <path d="M64 112h8M68 108v8" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
    <path d="M248 128h8M252 124v8" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
